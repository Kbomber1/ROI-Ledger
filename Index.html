<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROI Ledger</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- SIGN-IN MODAL -->
<div id="authModal" class="modal-overlay hidden">
  <div class="modal-box">
    <button class="modal-close" id="modalClose">✕</button>
    <h2>Sign In</h2>
    <p class="modal-sub">Enter your email — we'll send you a magic link.</p>
    <input type="email" id="authEmail" placeholder="you@example.com" autocomplete="email">
    <button id="authSendBtn" class="btn-primary">Send Magic Link</button>
    <p class="modal-status" id="authStatus"></p>
  </div>
</div>

<div class="container">

  <div class="auth-bar">
    <button id="auth-btn">Sign In</button>
    <span id="user-info"></span>
  </div>

  <h1>ROI Ledger</h1>
  <p class="subtitle">Investment payout &amp; pay date, business days only</p>

  <div class="form-group">
    <label>Investment name / counterparty</label>
    <input type="text" id="invName" value="trade">
  </div>

  <div class="row">
    <div class="col form-group">
      <label>Investment amount</label>
      <input type="number" id="invAmount" value="1000" step="any">
    </div>
    <div class="col form-group">
      <label>Currency</label>
      <select id="currencySelect">
        <option value="$">USD $</option>
        <option value="€">EUR €</option>
        <option value="£">GBP £</option>
      </select>
    </div>
  </div>

  <div class="row">
    <div class="col form-group">
      <label>ROI %</label>
      <input type="number" id="roiPercent" value="1.5" step="any">
    </div>
    <div class="col form-group">
      <label>Business days</label>
      <input type="number" id="busDays" value="7" step="1">
    </div>
  </div>

  <div class="form-group">
    <label>Start date</label>
    <input type="date" id="startDate" value="2026-09-20">
  </div>

  <button id="calculate-btn" class="btn-primary">Calculate</button>

  <div class="results" id="results" style="display:none;">
    <div class="results-label">Payout amount</div>
    <div class="payout-amount" id="payoutAmount"></div>
    <div class="profit-text" id="profitText"></div>

    <div class="detail-row">
      <span class="detail-label">Principal</span>
      <span id="principalVal"></span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Pay date</span>
      <span id="payDateVal"></span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Calendar span</span>
      <span id="calSpanVal"></span>
    </div>
  </div>

  <button id="history-btn" class="btn-secondary">View My History</button>
  <div id="history-list"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
