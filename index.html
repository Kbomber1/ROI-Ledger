<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1428">
<title>ROI Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- TOAST -->
<div id="toast" class="toast"></div>

<!-- SIGN-IN MODAL -->
<div id="authModal" class="modal-overlay hidden">
  <div class="modal-box">
    <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
    <div class="modal-icon">🔐</div>
    <h2>Sign In</h2>
    <p class="modal-sub">Enter your email — we'll send you a magic link.</p>
    <div class="input-wrap">
      <input type="email" id="authEmail" placeholder="you@example.com" autocomplete="email" inputmode="email">
    </div>
    <button type="button" id="authSendBtn" class="btn-primary">
      <span id="authSendLabel">Send Magic Link</span>
    </button>
    <p class="modal-status" id="authStatus"></p>
  </div>
</div>

<div class="container">

  <!-- HEADER -->
  <div class="header-bar">
    <div class="logo">
      <div class="logo-mark">%</div>
      <div>
        <div class="logo-text">ROI Ledger</div>
        <div class="logo-sub">Investment payout tracker</div>
      </div>
    </div>
    <button type="button" id="auth-btn" class="auth-chip">Sign In</button>
  </div>
  <div id="user-info" class="user-chip"></div>

  <!-- HERO -->
  <div class="hero">
    <h1>Calculate your payout</h1>
    <p class="subtitle">Business days only — weekends are automatically skipped.</p>
  </div>

  <!-- FORM -->
  <div class="card">

    <div class="form-group">
      <label>Investment name / counterparty</label>
      <div class="input-wrap">
        <input type="text" id="invName" placeholder="e.g. Trade with Alabi" autocomplete="off">
      </div>
    </div>

    <div class="row">
      <div class="col form-group">
        <label>Investment amount</label>
        <div class="input-wrap">
          <span class="input-prefix" id="currencyPrefix">₦</span>
          <input type="number" id="invAmount" placeholder="0.00" step="any" inputmode="decimal">
        </div>
      </div>
      <div class="col form-group">
        <label>Currency</label>
        <div class="input-wrap">
          <select id="currencySelect">
            <option value="₦">NGN ₦</option>
            <option value="$">USD $</option>
            <option value="€">EUR €</option>
            <option value="£">GBP £</option>
          </select>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col form-group">
        <label>ROI</label>
        <div class="input-wrap">
          <input type="number" id="roiPercent" placeholder="0.0" step="any" inputmode="decimal">
          <span class="input-suffix">%</span>
        </div>
      </div>
      <div class="col form-group">
        <label>Business days</label>
        <div class="input-wrap">
          <input type="number" id="busDays" placeholder="0" step="1" inputmode="numeric">
          <span class="input-suffix">days</span>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label>Start date</label>
      <div class="input-wrap">
        <input type="date" id="startDate">
      </div>
    </div>

    <button type="button" id="calculate-btn" class="btn-primary">Calculate payout</button>
  </div>

  <!-- RESULTS -->
  <div class="results" id="results" style="display:none;">

    <div class="result-hero">
      <div class="results-label">PAYOUT AMOUNT</div>
      <div class="payout-amount" id="payoutAmount"></div>
      <div class="profit-text" id="profitText"></div>
    </div>

    <div class="result-card">
      <div class="detail-row">
        <span class="detail-label">Principal</span>
        <span class="detail-value" id="principalVal"></span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Pay date</span>
        <span class="detail-value" id="payDateVal"></span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Calendar span</span>
        <span class="detail-value" id="calSpanVal"></span>
      </div>
    </div>

    <div class="timeline" id="timeline"></div>

    <button type="button" id="calendar-btn" class="btn-secondary">
      📅 Add payout to calendar
    </button>

  </div>

  <!-- HISTORY -->
  <button type="button" id="history-btn" class="btn-secondary">View my history</button>
  <div id="history-list"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
